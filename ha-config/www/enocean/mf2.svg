<text x="310" y="46" font-size="17" font-weight="700" fill="#1b2340">Oberer Schalter – Lernfunktion</text>
<rect x="312" y="58" width="12" height="12" rx="3" fill="#e8890c"/>
<text x="332" y="70" font-size="14" fill="#1b2340">5 = Wippe für BEIDE Kontakte gemeinsam</text>
<rect x="312" y="79" width="12" height="12" rx="3" fill="#e8890c"/>
<text x="332" y="91" font-size="14" fill="#1b2340">9 = Wippe nur für Kontakt 1</text>
<rect x="312" y="100" width="12" height="12" rx="3" fill="#e8890c"/>
<text x="332" y="112" font-size="14" fill="#1b2340">10 = Wippe nur für Kontakt 2</text>
<text x="332" y="133" font-size="14" fill="#1b2340">2/4 Zentral AUS/EIN · 3/7/8 Universaltaster</text>
<text x="332" y="154" font-size="14" fill="#1b2340">Nach dem Lernen: zurück auf die notierte Stellung</text>
<text x="310" y="185" font-size="17" font-weight="700" fill="#1b2340">Mittlerer Schalter</text>
<rect x="312" y="197" width="12" height="12" rx="3" fill="#2e9d5b"/>
<text x="332" y="209" font-size="14" fill="#1b2340">AUTO = Betrieb</text>
<rect x="312" y="218" width="12" height="12" rx="3" fill="#e8890c"/>
<text x="332" y="230" font-size="14" fill="#1b2340">LRN = Lernen (LED blinkt, aus = gelernt)</text>
<rect x="312" y="239" width="12" height="12" rx="3" fill="#d23c3c"/>
<text x="332" y="251" font-size="14" fill="#1b2340">CLR = Löschen – dabei oberen Schalter NICHT drehen</text>
<text x="310" y="282" font-size="17" font-weight="700" fill="#1b2340">Unterer Schalter – Betriebsart (nicht verstellen)</text>
<rect x="312" y="294" width="12" height="12" rx="3" fill="#2e9d5b"/>
<text x="332" y="306" font-size="14" fill="#1b2340">2S (2xS): Anlage-Einstellung; mit 9/10 Kontakte einzeln</text>
<text x="332" y="327" font-size="14" fill="#1b2340">WS, SS1–3, GS, 2R, WR, RR, GR: andere Betriebsarten</text>
<text x="310" y="358" font-size="17" font-weight="700" fill="#1b2340">Ablauf (1 Schritt pro Kontakt)</text>
<text x="332" y="382" font-size="14" fill="#1b2340">1. Oben 9 bzw. 10, Mitte LRN → „EIN / Lernen“</text>
<text x="332" y="403" font-size="14" fill="#1b2340">2. Mitte AUTO, oben zurück · EIN und AUS sind gelernt</text>
<rect x="312" y="412" width="12" height="12" rx="3" fill="#d23c3c"/>
<text x="332" y="424" font-size="14" fill="#1b2340">Einmal mit 5 gelernt? Erst löschen, dann 9/10</text>
<rect x="310" y="526" width="14" height="14" rx="3" fill="#2e9d5b"/>
<text x="330" y="538" font-size="13" fill="#1b2340">Betrieb</text>
