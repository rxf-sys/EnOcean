<text x="310" y="46" font-size="17" font-weight="700" fill="#1b2340">Oberer Schalter – Funktion aller 4 Kanäle</text>
<rect x="312" y="58" width="12" height="12" rx="3" fill="#2e9d5b"/>
<text x="332" y="70" font-size="14" fill="#1b2340">Betrieb: RT = Richtungstaster (Seite EIN / Seite AUS)</text>
<rect x="312" y="79" width="12" height="12" rx="3" fill="#d23c3c"/>
<text x="332" y="91" font-size="14" fill="#1b2340">UT: jeder Tastendruck schaltet um – nicht verwenden</text>
<rect x="312" y="100" width="12" height="12" rx="3" fill="#e8890c"/>
<text x="332" y="112" font-size="14" fill="#1b2340">Lernen: 0 = EIN lernen (Anschlag links neben 2)</text>
<rect x="312" y="121" width="12" height="12" rx="3" fill="#e8890c"/>
<text x="332" y="133" font-size="14" fill="#1b2340">Lernen: 2 = AUS lernen</text>
<text x="332" y="154" font-size="14" fill="#1b2340">EW 2–25 s: Ein, automatisch aus · ER: Relais</text>
<text x="310" y="185" font-size="17" font-weight="700" fill="#1b2340">Mittlerer Schalter</text>
<rect x="312" y="197" width="12" height="12" rx="3" fill="#2e9d5b"/>
<text x="332" y="209" font-size="14" fill="#1b2340">AUTO = Betrieb</text>
<rect x="312" y="218" width="12" height="12" rx="3" fill="#e8890c"/>
<text x="332" y="230" font-size="14" fill="#1b2340">LRN = Lernen (LED blinkt, aus = gelernt)</text>
<rect x="312" y="239" width="12" height="12" rx="3" fill="#d23c3c"/>
<text x="332" y="251" font-size="14" fill="#1b2340">CLR = Löschen – dabei oberen Schalter NICHT drehen</text>
<text x="310" y="282" font-size="17" font-weight="700" fill="#1b2340">Unterer Schalter</text>
<rect x="312" y="294" width="12" height="12" rx="3" fill="#2e9d5b"/>
<text x="332" y="306" font-size="14" fill="#1b2340">AUTO = Betrieb</text>
<rect x="312" y="315" width="12" height="12" rx="3" fill="#e8890c"/>
<text x="332" y="327" font-size="14" fill="#1b2340">1–4 = Kanal, der gelernt wird</text>
<text x="332" y="348" font-size="14" fill="#1b2340">ZE / ZA = Zentral-EIN / -AUS</text>
<text x="310" y="379" font-size="17" font-weight="700" fill="#1b2340">Ablauf pro Kanal (2 Schritte)</text>
<text x="332" y="403" font-size="14" fill="#1b2340">1. Unten Kanal, oben 0, Mitte LRN → „EIN / Lernen“</text>
<text x="332" y="424" font-size="14" fill="#1b2340">2. Oben 2, Mitte kurz AUTO → LRN → „AUS“</text>
<text x="332" y="445" font-size="14" fill="#1b2340">3. Unten + Mitte AUTO, oben zurück auf RT</text>
<rect x="310" y="526" width="14" height="14" rx="3" fill="#2e9d5b"/>
<text x="330" y="538" font-size="13" fill="#1b2340">Betrieb</text>
<rect x="430" y="526" width="14" height="14" rx="3" fill="#e8890c"/>
<text x="450" y="538" font-size="13" fill="#1b2340">Anlernen</text>
<rect x="550" y="526" width="14" height="14" rx="3" fill="#d23c3c"/>
<text x="570" y="538" font-size="13" fill="#1b2340">Vorsicht</text>
