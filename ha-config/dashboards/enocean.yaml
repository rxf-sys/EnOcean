  - title: Anlernen
    path: anlernen
    icon: mdi:school
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: Was wird angelernt?
            entities:
              - entity: input_select.enocean_teach_type
              - entity: input_number.enocean_teach_actuator
              - entity: input_number.enocean_teach_channel
          - type: markdown
            content: |-
              {% set sid = states('sensor.enocean_anlernen') -%}
              {% set used = (state_attr('sensor.enocean_devices', 'devices') or []) | selectattr('id', 'eq', sid) | map(attribute='name') | unique | list -%}
              ## Sender-ID: `{{ sid }}`
              {% if sid == 'ungültig' -%}
              ⚠️ **Ungültige Auswahl.** SR-4: Aktor 13–15, Kanal 1–4 · MF-2: Kontakt 1–2 · JRG-2: Motor 1–2
              {%- elif used -%}
              ℹ️ Diese ID gehört bereits zu **{{ used | join(', ') }}**. Zum Neu-Lernen oder Testen in Ordnung – für ein neues Gerät eine andere Nummer wählen.
              {%- else -%}
              ✅ Diese ID ist noch frei.
              {%- endif %}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: "Lernen / EIN / HOCH (0x70)"
                icon: mdi:arrow-up-bold-circle
                tap_action:
                  action: perform-action
                  perform_action: script.enocean_teach_send
                  data:
                    data_byte: 112
              - type: button
                name: "AUS / RUNTER (0x50)"
                icon: mdi:arrow-down-bold-circle
                tap_action:
                  action: perform-action
                  perform_action: script.enocean_teach_send
                  data:
                    data_byte: 80
      - type: markdown
        title: Schritt für Schritt
        content: |-
          {% set t = states('input_select.enocean_teach_type') -%}
          {% set n = states('input_number.enocean_teach_actuator') | int(0) -%}
          {% set c = states('input_number.enocean_teach_channel') | int(0) -%}
          {% set sid = states('sensor.enocean_anlernen') -%}
          **Immer:** Stellung aller Drehschalter vorher **fotografieren**. Nur **ein** Relais auf LRN. Nach LRN **sofort** den Knopf drücken.

          {% if t.startswith('SR-4') -%}
          ### SR-4 {{ n }}.{{ c }} – zwei Schritte
          1. Unten **{{ c }}**, oben **0**, Mitte **LRN** (LED blinkt) → **„Lernen / EIN“** → LED aus
          2. Oben **2**, Mitte kurz **AUTO** und wieder **LRN** → **„AUS“** → LED aus
          3. Unten **AUTO**, Mitte **AUTO**, oben auf **RT** (nicht UT!)
          4. Test: „Lernen / EIN“ = an · „AUS“ = aus
          {%- elif t.startswith('MF-2') -%}
          ### MF-2 {{ n }}, Kontakt {{ c }} – ein Schritt
          1. Oben **{{ 9 if c == 1 else 10 }}**, Mitte **LRN** (LED blinkt) → **„Lernen / EIN“** → LED aus
             *(Beide Kontakte gemeinsam schalten: oben **5** mit Kontakt 1)*
          2. Mitte **AUTO**, oben zurück auf die notierte Stellung
          3. Test: „Lernen / EIN“ = an · „AUS“ = aus
          4. ⚠️ Unteren Schalter nicht verstellen (steht auf 2S (2xS))
          {%- else -%}
          ### JRG-2 {{ n }}, Motor {{ c }} – ein Schritt
          1. **RV (oben) und WA (Mitte) aufschreiben!**
          2. Oben (RV) **{{ 10 if c == 1 else 30 }}**, Mitte (WA) **LRN** → **„Lernen / EIN“** → LED aus
          3. RV und WA **exakt** auf die notierten Werte zurück
          4. Test: „EIN“ = hoch · nochmal „EIN“ während der Fahrt = stopp · „AUS“ = runter
          {%- endif %}

          **Falsch gelernt?** Mitte auf **CLR** (oben **nicht** drehen!) → **„Lernen / EIN“** → Mitte zurück. Löscht nur diesen Sender.

          {% if sid.startswith('FF:C8:31:') -%}
          **Danach ins Paket `packages/enocean.yaml` eintragen:**
          ```yaml
          {% if t.startswith('JRG-2') -%}
          cover:
            - platform: enocean_new
              name: "Jalousie …"
              sender_id: [0xFF, 0xC8, 0x31, 0x{{ sid[9:11] }}]
              actuator: "JRG-2 {{ n }}, Motor {{ c }}"
          {%- else -%}
          switch:
            - platform: enocean_new
              name: "…"
              sender_id: [0xFF, 0xC8, 0x31, 0x{{ sid[9:11] }}]
              actuator: "{{ 'SR-4 %d.%d' | format(n, c) if t.startswith('SR-4') else 'MF-2 %d, Kontakt %d' | format(n, c) }}"
              on_data: 0x70
              off_data: 0x50
          {%- endif %}
          ```
          {%- endif %}
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.enocean_teach_type
            state: "SR-4 (4-Kanal, Licht)"
        card:
          type: picture
          image: /local/enocean/sr4.svg?v=1
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.enocean_teach_type
            state: "MF-2 (2 Kontakte)"
        card:
          type: picture
          image: /local/enocean/mf2.svg?v=1
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.enocean_teach_type
            state: "JRG-2 (Jalousie)"
        card:
          type: picture
          image: /local/enocean/jrg2.svg?v=1

  - title: Geräte
    path: geraete
    icon: mdi:format-list-bulleted
    cards:
      - type: markdown
        title: EnOcean-Geräte (automatisch aus der Konfiguration)
        content: |-
          {% set a = states.sensor.enocean_devices.attributes if states.sensor.enocean_devices else {} -%}
          **{{ states('sensor.enocean_devices') }} Geräte** · Stick Base-ID `{{ a.base_id }}` · Chip-ID `{{ a.chip_id }}`

          Gültige Sender-IDs: {{ a.sender_range }}

          | Gerät | Art | ID | Rolle | Aktor / Kanal | Codes | zuletzt empfangen | dBm |
          |---|---|---|---|---|---|---|---|
          {% for d in a.devices or [] -%}
          | {{ d.name }} | {{ d.kind }} | `{{ d.id }}` | {{ d.role }} | {{ d.actuator or '–' }} | {{ d.codes or '–' }} | {{ d.last_seen }} | {{ d.dbm if d.dbm is not none else '–' }} |
          {% endfor %}
      - type: markdown
        title: Empfangene, noch nicht eingetragene IDs
        content: |-
          {% set u = state_attr('sensor.enocean_devices', 'unknown') or [] -%}
          {% if u -%}
          Diese Geräte funken, sind aber noch keinem Eintrag zugeordnet (z. B. Fensterkontakte, weitere Taster).
          Zum Zuordnen das Gerät betätigen und schauen, welche Zeile sich aktualisiert.

          | ID | Typ | zuletzt | Anzahl | letzter Code | dBm |
          |---|---|---|---|---|---|
          {% for d in u -%}
          | `{{ d.id }}` | {{ {'0xF6': 'Taster', '0xD5': 'Kontakt', '0xA5': 'Sensor', '0xD2': 'VLD'}.get(d.rorg, d.rorg) }} | {{ d.time }} | {{ d.count }} | {{ d.data }} | {{ d.dbm }} |
          {% endfor %}
          {%- else -%}
          Keine unbekannten Geräte empfangen.
          {%- endif %}

  - title: EnOcean-Monitor
    path: monitor
    icon: mdi:radio-tower
    cards:
      - type: markdown
        title: Empfangene Telegramme (neueste oben)
        content: |-
          Drücke einen Taster oder öffne ein Fenster: Das Telegramm erscheint hier.
          **„?“ = unbekanntes Gerät** – die ID kann dann in der Konfiguration eingetragen werden.

          | Zeit | ID | Gerät | Typ | Daten | dBm |
          |---|---|---|---|---|---|
          {% for t in state_attr('sensor.enocean_monitor', 'telegrams') or [] -%}
          | {{ t.time }} | `{{ t.sender_id }}` | {{ t.name }} | {{ {'0xF6': 'Taster', '0xD5': 'Kontakt', '0xA5': 'Sensor', '0xD2': 'VLD'}.get(t.rorg, t.rorg) }} | {{ t.data }} | {{ t.dbm }} |
          {% endfor %}
      - type: logbook
        title: Verlauf (letzte 24 h)
        hours_to_show: 24
        entities:
          - sensor.enocean_monitor
      - type: markdown
        title: Codes der Wipptaster
        content: |-
          | Daten | Taste (EEP F6-02) |
          |---|---|
          | 0x30 | linke Wippe, Seite 0 (A0) |
          | 0x10 | linke Wippe, Seite I (AI) |
          | 0x70 | rechte Wippe, Seite 0 (B0) |
          | 0x50 | rechte Wippe, Seite I (BI) |
          | 0x00 | losgelassen |

          Welche Seite oben ist, hängt vom Taster ab (Gäste-WC: unten = 0x70).
          Im Zweifel Taste drücken und den Code oben in der Tabelle ablesen.

  - title: Automationen
    path: automationen
    icon: mdi:robot
    cards:
      - type: markdown
        title: Neue Regel anlegen
        content: |-
          **[➕ Neue Automation](/config/automation/edit/new)** · **[📋 Vorlagen (Blueprints)](/config/blueprint/dashboard)** · **[⚙️ Alle Automationen](/config/automation/dashboard)**

          | Art | Vorlage | Beispiel |
          |---|---|---|
          | ⏰ Zeitgesteuert | *EnOcean: Jalousien nach Zeitplan* | morgens 7:00 hoch, abends 21:00 runter |
          | 🔘 Schaltergesteuert | *EnOcean: Wandtaster löst Aktion aus* | Taster links oben → alle Jalousien runter |
          | 📡 Sensorgesteuert | *EnOcean: Sensor schaltet Licht* · *EnOcean: Fenster offen → Jalousie hoch* | Fensterkontakt öffnet → Jalousie fährt hoch |

          Vorlage öffnen → „Automation erstellen“ → Felder ausfüllen → Speichern.
          Die Taster-ID und den Code liest du im Tab **EnOcean-Monitor** ab.
      - type: markdown
        title: Vorhandene Automationen
        content: |-
          | Automation | Status | Zuletzt ausgelöst |
          |---|---|---|
          {% for a in states.automation | sort(attribute='name') -%}
          | {{ a.name }} | {{ 'aktiv' if a.state == 'on' else 'aus' }} | {{ relative_time(a.attributes.last_triggered) if a.attributes.last_triggered else '–' }} |
          {% else -%}
          | – | keine Automationen | – |
          {% endfor %}
