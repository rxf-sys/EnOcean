send_rps:
  name: Send RPS telegram
  description: >-
    Send a raw RPS (F6) telegram from the EnOcean dongle.
    Useful for teach-in and debugging.
  fields:
    sender_id:
      name: Sender ID
      description: >-
        4-byte sender address. Must be the dongle's chip ID or within
        base_id .. base_id + 127 (both are logged at startup); other IDs
        are refused.
      required: true
      example: "[0xFF, 0xC8, 0x31, 0x81]"
      selector:
        object:
    data_byte:
      name: Data byte
      description: >-
        RPS data byte. Common values: 0x50 = Rocker B ON,
        0x70 = Rocker B OFF, 0x10 = Rocker A ON, 0x30 = Rocker A OFF,
        0x00 = button released.
      required: true
      example: "0x50"
      selector:
        number:
          min: 0
          max: 255
          mode: box
    status:
      name: Status byte
      description: >-
        Status byte. 0x30 = button pressed (T21=1, NU=1),
        0x20 = button released (T21=1, NU=0).
      required: false
      default: 48
      example: "0x30"
      selector:
        number:
          min: 0
          max: 255
          mode: box
    press_release:
      name: Send press + release pair
      description: >-
        If true, automatically sends a release telegram (data_byte=0x00,
        status=0x20) after a short delay.
      required: false
      default: true
      selector:
        boolean:

teach_in:
  name: Teach-in actuator
  description: >-
    Send a teach-in RPS telegram (press + release) for a specific sender_id.
    Put ONLY the target actuator in LRN mode BEFORE calling this service.
    By default the ON telegram of the channel is sent (channel 0 = 0x50,
    channel 1 = 0x10); set data_byte to teach with another rocker key.
    Use a UNIQUE sender_id per actuator.
  fields:
    sender_id:
      name: Sender ID
      description: >-
        4-byte sender address for this actuator. Must be the dongle's chip ID
        or within base_id .. base_id + 127.
      required: true
      example: "[0xFF, 0xC8, 0x31, 0x81]"
      selector:
        object:
    channel:
      name: Channel
      description: >-
        Rocker channel used for the default data byte:
        0 = Rocker B (default), 1 = Rocker A.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 1
          mode: box
    data_byte:
      name: Data byte
      description: >-
        Optional rocker key to teach with, overriding the channel default.
        0x70 = B0 (rocker B top), 0x50 = BI (rocker B bottom),
        0x30 = A0 (rocker A top), 0x10 = AI (rocker A bottom).
      required: false
      example: "0x70"
      selector:
        number:
          min: 0
          max: 255
          mode: box

test_sender:
  name: Test sender_id differentiation
  description: >-
    Diagnostic test: for two different sender_id offsets, sends ON, waits,
    sends OFF (channel 0 data bytes). Watch which actuators react to each test.
    An actuator taught with base_id + offset_a must react ONLY to test A.
    If it also reacts to test B, it was taught with another ID as well
    (clear its memory and teach it again).
  fields:
    sender_offset_a:
      name: Sender offset A
      description: >-
        Offset from base_id for test A. The actuator should be taught with this offset.
      required: false
      default: 0
      example: "0"
      selector:
        number:
          min: 0
          max: 127
          mode: box
    sender_offset_b:
      name: Sender offset B
      description: >-
        Offset from base_id for test B. The actuator should NOT be taught with this offset.
        If the actuator reacts to this test, sender_id differentiation is broken.
      required: false
      default: 1
      example: "1"
      selector:
        number:
          min: 0
          max: 127
          mode: box
    delay:
      name: Delay between tests (seconds)
      description: >-
        Seconds to wait between test A and test B.
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 30
          mode: box
